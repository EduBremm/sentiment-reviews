services:
  db:
    image: postgres:16-alpine
    container_name: reviews_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reviews}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: reviews_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-reviews}
      MODEL_PATH: /app/models/best_model.pkl
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build: .
    container_name: reviews_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-reviews}
      API_URL: http://api:8000
    volumes:
      - ./dashboard:/app/dashboard
      - ./src:/app/src
      - ./models:/app/models
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  pgdata:
